          "Initial B-Tree structure with policy IDs sorted",

          "P027 > P033, go left subtree",

        return (

            <div className="bg-gradient-to-r from-blue-50 to-indigo-50 p-6 rounded-lg border-2 border-blue-200">
              <h3 className="font-bold text-lg mb-4 text-gray-800">B-Tree Index on Policy_ID</h3>
              
              <div className="flex flex-col items-center space-y-8">
                <div className={`px-6 py-3 bg-white border-2 rounded-lg font-mono text-sm transition-all duration-500 ${
                  highlights[btreeStep]?.includes('P033') ? 'border-green-500 shadow-lg scale-110' : 'border-gray-300'

                  <div className={`px-4 py-2 bg-white border-2 rounded-lg font-mono text-xs transition-all duration-500 ${

                  <div className={`px-3 py-2 bg-blue-100 border rounded font-mono text-xs transition-all duration-500 ${
                    highlights[btreeStep]?.includes('P015') ? 'border-green-500 shadow-lg' : ''
                  }`}>P015</div>
                  <div className={`px-3 py-2 bg-blue-100 border rounded font-mono text-xs transition-all duration-500 ${
                    highlights[btreeStep]?.includes('P027') ? 'border-green-500 shadow-lg' : ''

                  <div className="px-3 py-2 bg-blue-100 border rounded font-mono text-xs">P045</div>
                  <div className="px-3 py-2 bg-blue-100 border rounded font-mono text-xs">P058</div>
                </div>
              </div>

              <div className="mt-6 p-4 bg-white rounded-lg border border-blue-300">
                <p className="text-sm text-gray-700">{descriptions[btreeStep]}</p>

              <div className="flex gap-2 mt-4">
                <button

                >
                  {isPlaying ? <Pause size={16} /> : <Play size={16} />}
                  {isPlaying ? 'Pause' : 'Play'}
                </button>
                <button
                  onClick={() => setBtreeStep(0)}
                  className="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 flex items-center gap-2"
                >
                  <RotateCcw size={16} />

            </div>

            <div className="grid grid-cols-2 gap-4">
              <div className="bg-red-50 p-4 rounded-lg border-2 border-red-300">

                <div className="text-sm space-y-1">

      const QueryPlanAnalyzer = () => {
        const queryPlans = [
          {
            query: "SELECT * FROM policies WHERE customer_id = 98765",
            withoutIndex: {
              plan: "Seq Scan on policies",
              cost: "0.00..25000.00",
              rows: 1000000,

              operations: ["Full Table Scan", "Filter Rows", "Return Results"]
            },
            withIndex: {
              plan: "Index Scan using idx_customer_id",
              cost: "0.42..8.44",
              rows: 50,
              time: "15ms",
              operations: ["Index Lookup", "Retrieve Rows", "Return Results"]
            }
          },
          {
            query: "SELECT * FROM claims WHERE claim_date BETWEEN '2024-01-01' AND '2024-12-31'",
            withoutIndex: {
              plan: "Seq Scan on claims",
              cost: "0.00..50000.00",
              rows: 5000000,
              time: "12000ms",
              operations: ["Full Table Scan", "Date Filter", "Return Results"]
            },
            withIndex: {
              plan: "Index Range Scan using idx_claim_date",
              cost: "0.56..125.30",
              rows: 365000,

              operations: ["Index Range Scan", "Retrieve Matching Rows", "Return Results"]

          {

              operations: ["Full Table Scan", "Filter & Project", "Return Results"]
            },
            withIndex: {
              plan: "Index Only Scan using idx_covering",
              cost: "0.28..4.50",
              rows: 50,

          <div className="space-y-4">
            <div className="bg-gradient-to-r from-purple-50 to-pink-50 p-4 rounded-lg border-2 border-purple-300">
              <h3 className="font-bold text-lg mb-2">🔍 Query Plan Analyzer</h3>
              <p className="text-sm text-gray-700">Compare execution plans with and without indexes</p>
            </div>

            {queryPlans.map((plan, idx) => (
              <div key={idx} className="bg-white p-4 rounded-lg border-2 border-gray-300">
                <div className="mb-3">
                  <div className="flex items-center justify-between mb-2">

                    <button

                      <h5 className="font-bold text-green-800 text-sm mb-2">✅ With Index</h5>
                      <div className="space-y-2 text-xs">
                        <div>
                          <span className="font-semibold">Plan:</span> {plan.withIndex.plan}

                            ))}
                          </ol>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                <div className="mt-3 p-2 bg-blue-50 rounded text-center">
                  <span className="text-sm font-bold text-blue-800">
                    ⚡ Speed Improvement: {Math.round(parseInt(plan.withoutIndex.time) / parseInt(plan.withIndex.time))}x faster
                  </span>
                </div>
              </div>
            ))}
          </div>
        );
      };

      const IndexMaintenanceGuide = () => {
        return (
          <div className="space-y-4">
            <div className="bg-gradient-to-r from-orange-50 to-red-50 p-4 rounded-lg border-2 border-orange-300">
              <h3 className="font-bold text-lg mb-2">🔧 Index Maintenance & Monitoring</h3>
              <p className="text-sm text-gray-700">Keep your indexes healthy and performant</p>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div className="bg-white p-4 rounded-lg border-2 border-blue-300">
                <h4 className="font-bold text-blue-800 mb-3 flex items-center gap-2">
                  <Activity size={18} />
                  Daily Monitoring
                </h4>
                <div className="space-y-3">
                  <div className="bg-blue-50 p-3 rounded">
                    <p className="text-xs font-semibold mb-1">Check Index Usage</p>
                    <code className="text-xs bg-gray-800 text-green-400 p-2 rounded block">
                      SELECT schemaname, tablename, indexname, idx_scan<br/>
                      FROM pg_stat_user_indexes<br/>

                    <p className="text-xs text-gray-600 mt-1">Find unused indexes to remove</p>

                  <div className="bg-blue-50 p-3 rounded">
                    <p className="text-xs font-semibold mb-1">Monitor Query Performance</p>
                    <code className="text-xs bg-gray-800 text-green-400 p-2 rounded block">
                      SELECT query, mean_time, calls<br/>
                      FROM pg_stat_statements<br/>
                      ORDER BY mean_time DESC LIMIT 10;
                    </code>
                    <p className="text-xs text-gray-600 mt-1">Identify slow queries needing indexes</p>
                  </div>
                </div>
              </div>

              <div className="bg-white p-4 rounded-lg border-2 border-green-300">
                <h4 className="font-bold text-green-800 mb-3 flex items-center gap-2">
                  <Clock size={18} />
                  Weekly Tasks
                </h4>
                <div className="space-y-3">
                  <div className="bg-green-50 p-3 rounded">
                    <p className="text-xs font-semibold mb-1">Update Statistics</p>
                    <code className="text-xs bg-gray-800 text-green-400 p-2 rounded block">
                      ANALYZE policies;<br/>
                      ANALYZE claims;<br/>
                      ANALYZE customers;
                    </code>
                    <p className="text-xs text-gray-600 mt-1">Keep query planner informed</p>
                  </div>

                  <div className="bg-green-50 p-3 rounded">
                    <p className="text-xs font-semibold mb-1">Check Index Bloat</p>
                    <code className="text-xs bg-gray-800 text-green-400 p-2 rounded block">
                      SELECT schemaname, tablename,<br/>
                      pg_size_pretty(pg_relation_size(indexrelid))<br/>
                      FROM pg_stat_user_indexes;
                    </code>
                    <p className="text-xs text-gray-600 mt-1">Monitor index size growth</p>
                  </div>
                </div>
              </div>

              <div className="bg-white p-4 rounded-lg border-2 border-purple-300">
                <h4 className="font-bold text-purple-800 mb-3 flex items-center gap-2">
                  <Settings size={18} />
                  Monthly Maintenance
                </h4>
                <div className="space-y-3">
                  <div className="bg-purple-50 p-3 rounded">
                    <p className="text-xs font-semibold mb-1">Rebuild Fragmented Indexes</p>
                    <code className="text-xs bg-gray-800 text-green-400 p-2 rounded block">
                      REINDEX INDEX CONCURRENTLY<br/>
                      idx_policies_customer_id;
                    </code>
                    <p className="text-xs text-gray-600 mt-1">Reduce bloat, improve performance</p>
                  </div>

                  <div className="bg-purple-50 p-3 rounded">
                    <p className="text-xs font-semibold mb-1">Vacuum Tables</p>
                    <code className="text-xs bg-gray-800 text-green-400 p-2 rounded block">
                      VACUUM ANALYZE policies;
                    </code>
                    <p className="text-xs text-gray-600 mt-1">Reclaim space, update stats</p>
                  </div>
                </div>
              </div>

              <div className="bg-white p-4 rounded-lg border-2 border-yellow-300">
                <h4 className="font-bold text-yellow-800 mb-3 flex items-center gap-2">
                  <Shield size={18} />
                  Quarterly Review

                <div className="space-y-3">

                    <ul className="text-xs space-y-1 ml-4 mt-2">
                      <li>• Remove unused indexes (0 scans)</li>
                      <li>• Add indexes for new query patterns</li>
                      <li>• Consolidate duplicate indexes</li>
                      <li>• Review composite index order</li>
                    </ul>
                  </div>

                  <div className="bg-yellow-50 p-3 rounded">
                    <p className="text-xs font-semibold mb-1">Capacity Planning</p>
                    <ul className="text-xs space-y-1 ml-4 mt-2">
                      <li>• Project storage growth</li>
                      <li>• Plan for table partitioning</li>
                      <li>• Consider archival strategies</li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-red-50 p-4 rounded-lg border-2 border-red-400">
              <h4 className="font-bold text-red-800 mb-2">⚠️ Warning Signs</h4>
              <div className="grid grid-cols-3 gap-3 text-xs">
                <div>
                  <p className="font-semibold">Slow Queries</p>
                  <p className="text-gray-700">Queries taking &gt;100ms</p>
                  <p className="text-red-700 mt-1">→ Check missing indexes</p>
                </div>
                <div>
                  <p className="font-semibold">Index Bloat</p>
                  <p className="text-gray-700">Index &gt;2x table size</p>
                  <p className="text-red-700 mt-1">→ REINDEX needed</p>
                </div>
                <div>
                  <p className="font-semibold">Low Hit Ratio</p>
                  <p className="text-gray-700">Cache hit &lt;95%</p>
                  <p className="text-red-700 mt-1">→ Need more indexes or RAM</p>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const PartitioningGuide = () => {
        return (
          <div className="space-y-4">
            <div className="bg-gradient-to-r from-indigo-50 to-purple-50 p-4 rounded-lg border-2 border-indigo-300">
              <h3 className="font-bold text-lg mb-2">📊 Table Partitioning + Indexing</h3>
              <p className="text-sm text-gray-700">Scale to billions of rows with partitioning strategies</p>
            </div>

            <div className="bg-white p-4 rounded-lg border-2 border-blue-300">
              <h4 className="font-bold text-blue-800 mb-3">Range Partitioning by Date</h4>
              <div className="bg-gray-50 p-3 rounded mb-3">
                <code className="text-xs bg-gray-800 text-green-400 p-2 rounded block whitespace-pre">
{`CREATE TABLE claims (
  claim_id BIGINT,
  customer_id INT,
  claim_date DATE,
  amount DECIMAL(10,2)
) PARTITION BY RANGE (claim_date);

-- Create yearly partitions
CREATE TABLE claims_2024 PARTITION OF claims
  FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');

CREATE TABLE claims_2023 PARTITION OF claims
  FOR VALUES FROM ('2023-01-01') TO ('2024-01-01');

-- Index each partition
CREATE INDEX idx_claims_2024_customer ON claims_2024(customer_id);
CREATE INDEX idx_claims_2023_customer ON claims_2023(customer_id);`}
                </code>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-green-50 p-3 rounded">
                  <p className="text-xs font-semibold text-green-800 mb-1">✅ Benefits:</p>
                  <ul className="text-xs space-y-1 ml-4">
                    <li>• Query only relevant partitions</li>
                    <li>• Drop old partitions instantly</li>
                    <li>• Smaller indexes = faster scans</li>
                    <li>• Parallel partition scanning</li>
                  </ul>
                </div>
                <div className="bg-blue-50 p-3 rounded">
                  <p className="text-xs font-semibold text-blue-800 mb-1">📈 Use Cases:</p>
                  <ul className="text-xs space-y-1 ml-4">
                    <li>• Claims by year/month</li>
                    <li>• Policies by effective date</li>
                    <li>• Audit logs by timestamp</li>
                    <li>• Historical data archival</li>
                  </ul>
                </div>
              </div>
            </div>

            <div className="bg-white p-4 rounded-lg border-2 border-purple-300">
              <h4 className="font-bold text-purple-800 mb-3">Hash Partitioning by Customer</h4>
              <div className="bg-gray-50 p-3 rounded mb-3">
                <code className="text-xs bg-gray-800 text-green-400 p-2 rounded block whitespace-pre">
{`CREATE TABLE policies (
  policy_id BIGINT,
  customer_id INT,
  policy_type VARCHAR(50)
) PARTITION BY HASH (customer_id);

-- Create hash partitions (distribute evenly)
CREATE TABLE policies_p0 PARTITION OF policies
  FOR VALUES WITH (MODULUS 4, REMAINDER 0);
  
CREATE TABLE policies_p1 PARTITION OF policies
  FOR VALUES WITH (MODULUS 4, REMAINDER 1);

-- Continue for p2, p3...

-- Index each partition
CREATE INDEX idx_policies_p0_customer ON policies_p0(customer_id);`}
                </code>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-green-50 p-3 rounded">
                  <p className="text-xs font-semibold text-green-800 mb-1">✅ Benefits:</p>
                  <ul className="text-xs space-y-1 ml-4">
                    <li>• Even data distribution</li>
                    <li>• Parallel inserts/updates</li>
                    <li>• No hot partitions</li>
                    <li>• Good for high-write tables</li>
                  </ul>
                </div>
                <div className="bg-purple-50 p-3 rounded">
                  <p className="text-xs font-semibold text-purple-800 mb-1">📊 Performance:</p>
                  <ul className="text-xs space-y-1 ml-4">
                    <li>• 50M rows → 4 x 12.5M</li>
                    <li>• Faster index lookups</li>
                    <li>• Reduced lock contention</li>
                    <li>• Better maintenance windows</li>
                  </ul>
                </div>
              </div>
            </div>

            <div className="bg-yellow-50 p-4 rounded-lg border-2 border-yellow-400">
              <h4 className="font-bold text-yellow-800 mb-2">🎯 Partitioning Strategy Decision</h4>
              <div className="grid grid-cols-3 gap-3 text-xs">
                <div className="bg-white p-3 rounded border border-yellow-300">
                  <p className="font-semibold mb-1">Range (Date/Number)</p>
                  <p className="text-gray-700 mb-2">When: Time-series data, natural ranges</p>
                  <p className="text-green-700">✓ Easy archival</p>
                  <p className="text-green-700">✓ Query pruning</p>
                  <p className="text-red-700">✗ Hot partitions</p>
                </div>
                <div className="bg-white p-3 rounded border border-yellow-300">
                  <p className="font-semibold mb-1">Hash (ID/Key)</p>
                  <p className="text-gray-700 mb-2">When: Even distribution needed</p>
                  <p className="text-green-700">✓ No hot spots</p>
                  <p className="text-green-700">✓ Parallel writes</p>
                  <p className="text-red-700">✗ No archival</p>
                </div>
                <div className="bg-white p-3 rounded border border-yellow-300">
                  <p className="font-semibold mb-1">List (Category)</p>
                  <p className="text-gray-700 mb-2">When: Clear categories</p>
                  <p className="text-green-700">✓ Logical separation</p>
                  <p className="text-red-700">✗ Uneven sizes</p>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const IndexTypesComparison = () => {
        const indexTypes = [
          {
            name: 'B-Tree',
            icon: '🌲',
            useCase: 'Policy lookups, date ranges',
            example: 'WHERE policy_id = "AUTO-2024-001"',
            pros: 'Range queries, sorting, general purpose',
